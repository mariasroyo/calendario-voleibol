<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calendario de partidos</title>
  <meta name="description" content="Calendario actualizado desde la Federación de Madrid de Voleibol.">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">VOLEIBOL MADRID</p>
        <h1 id="club-name">Calendario de partidos</h1>
        <p id="club-meta" class="muted">Cargando datos de la Federación…</p>
      </div>
      <button id="refresh" class="secondary" type="button" title="Volver a consultar la Federación">
        ↻ Actualizar
      </button>
    </header>

    <section class="toolbar" aria-label="Opciones">
      <label class="switch">
        <input id="home-only" type="checkbox">
        <span>Solo partidos en casa</span>
      </label>
      <button id="hide-past" class="secondary" type="button">Ocultar pasados</button>
      <a id="ics-link" class="secondary link-button" href="#" download>Descargar .ics</a>
      <a id="source-link" class="secondary link-button" href="#" target="_blank" rel="noopener">Ver FMVB</a>
    </section>

    <div id="status" class="status" role="status">Consultando la Federación…</div>
    <section id="calendar" aria-live="polite"></section>

    <footer>
      <span id="updated"></span>
      <span> · </span>
      <a href="https://fmvoley.com/clasificaciones-y-resultados" target="_blank" rel="noopener">Fuente: FMVB</a>
    </footer>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
